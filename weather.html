<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <h2><span class="logo-icon">🌐</span> InfoSphere</h2>
    <div class="nav-links">
      <a href="index.html" class="nav-btn">News</a>
      <a href="weather.html" class="nav-btn active">Weather</a>
      <a href="countries.html" class="nav-btn">Countries</a>
      <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </button>
    </div>
  </nav>

  <div class="container">
    <h1>Weather Dashboard</h1>
    <p class="subtitle">Check real-time weather updates</p>

    <div class="search-box">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="cityInput" placeholder="Enter city name (e.g. London)...">
      <button class="primary-btn" onclick="getWeather()">Search</button>
    </div>

    <p id="loading"></p>

    <div id="weatherContainer"></div>
  </div>

  <script src="weather.js"></script>
</body>
</html>
