<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>InfoSphere Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <h2>InfoSphere</h2>
    <div class="nav-links">
      <button>News</button>
      <button>Weather</button>
      <button>Countries</button>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container">

    <h1>Dashboard</h1>
    <p class="subtitle">Stay updated with real-time news and insights</p>

    <!-- Search -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search news...">
      <button onclick="getNews()">🔍 Search</button>
    </div>

    <!-- Loading -->
    <p id="loading"></p>

    <!-- News -->
    <div id="newsContainer"></div>

  </div>

  <script src="index.js"></script>
</body>
</html>
